<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Hostile page for the prompt overlay</title>
  <style>
    /* Hostile page: centered text everywhere plus aggressive focus styling
       on inputs. Jari's overlay must stay left-aligned and borderless. */
    body {
      text-align: center;
      font: 14px sans-serif;
    }
    input {
      text-align: center;
      border: 3px dashed lime;
    }
    input:focus,
    input:focus-visible,
    input:active {
      outline: 3px solid red;
      border: 3px solid fuchsia;
      box-shadow: 0 0 0 4px blue;
    }
    /* Nerdfonts.com Skeleton rules that previously broke the prompt:
       210px white input and gappy list rows. Shadow DOM must isolate us. */
    input[type="text"],
    input[type="password"],
    input[type="email"],
    textarea,
    select {
      padding: 6px 4px;
      outline: none;
      margin: 0;
      width: 210px;
      max-width: 100%;
      display: block;
      background: #fff;
    }
    li {
      line-height: 18px;
      margin-bottom: 12px;
    }
    ul,
    ol {
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <p>Centered hostile page</p>
  <a href="#a">link a</a>
  <a href="#b">link b</a>
</body>
</html>
