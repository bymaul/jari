name: ci
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm test
      - run: npm run build:chrome
      - name: docs demo stays out of packaged builds
        run: node -e "const m=require('fs').readFileSync('build.js','utf8').match(/const distFiles = \[(.*?)\];/s);if(!m)throw new Error('distFiles not found');if(/demo|docs/i.test(m[1]))throw new Error('docs/ must not be packaged')"
      - name: generated bundles are in sync
        run: git diff --exit-code -- content/bundle.js background.js options/options.bundle.js manifest.json
